[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re-gear-steamos"
version = "0.3.79"
description = "Re-Gear: safety-first SteamOS handheld docking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ronnie Rosal" }]
dependencies = []

[project.scripts]
regear-diagnose = "regear.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
