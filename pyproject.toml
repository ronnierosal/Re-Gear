[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handheld-dock-mode-steamos"
version = "0.3.33"
description = "Re-Gear: safety-first SteamOS handheld docking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ronnie Rosal" }]
dependencies = []

[project.scripts]
hdm-diagnose = "hdm.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
