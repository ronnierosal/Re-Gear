<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Quick Access visual how-to</title>
  <desc id="desc">Four development UI steps: tap Y to change, tap Y on an empty slot to add, hold Y to move, and use Reset Layout in Settings.</desc>
  <rect width="1200" height="600" rx="22" fill="#08131d"/>
  <text x="45" y="58" fill="#59c7ff" font-family="Arial" font-size="30" font-weight="700">Quick Access — visual how-to</text>
  <g font-family="Arial">
    <g fill="#102633" stroke="#315166">
      <rect x="40" y="100" width="260" height="400" rx="16"/>
      <rect x="330" y="100" width="260" height="400" rx="16"/>
      <rect x="620" y="100" width="260" height="400" rx="16"/>
      <rect x="910" y="100" width="250" height="400" rx="16"/>
    </g>
    <g fill="#59c7ff" font-size="23" font-weight="700">
      <text x="65" y="145">1 · Change</text>
      <text x="355" y="145">2 · Add</text>
      <text x="645" y="145">3 · Move</text>
      <text x="935" y="145">4 · Reset</text>
    </g>
    <g fill="#e9f4fa" font-size="18">
      <text x="65" y="190">Focus a Quick Access</text><text x="65" y="218">button and tap Y.</text>
      <text x="65" y="260">Choose a replacement.</text>
      <text x="355" y="190">Focus an Empty slot</text><text x="355" y="218">and tap Y.</text>
      <text x="355" y="260">Choose a button.</text>
      <text x="645" y="190">Focus a card and</text><text x="645" y="218">hold Y about ½ second.</text>
      <text x="645" y="260">D-pad moves · A places.</text>
      <text x="935" y="190">Open Settings.</text><text x="935" y="225">Select Reset Layout.</text>
      <text x="935" y="260">Select Reset layout.</text>
    </g>
    <g fill="#12334a">
      <rect x="70" y="330" width="200" height="80" rx="12"/>
      <rect x="360" y="330" width="200" height="80" rx="12"/>
      <rect x="650" y="330" width="200" height="80" rx="12"/>
      <rect x="935" y="330" width="200" height="80" rx="12"/>
    </g>
    <g fill="#59c7ff" font-size="18" text-anchor="middle">
      <text x="170" y="378">Tap Y</text>
      <text x="460" y="378">Tap Y</text>
      <text x="750" y="378">Hold Y</text>
      <text x="1035" y="378">Reset Layout</text>
    </g>
    <text x="600" y="548" text-anchor="middle" fill="#91a8b6" font-size="16">DEVELOPMENT UI MOCKUP — production profile currently hides customization</text>
    <text x="600" y="573" text-anchor="middle" fill="#91a8b6" font-size="15">Illustration only; replace with versioned device screenshots after installed validation</text>
  </g>
</svg>
