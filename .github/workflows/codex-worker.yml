name: Codex software worker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, labeled, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [CI, Coordination orchestrator]
    types: [completed]

# Execution has its own queue; only the existing coordinator writes records.
concurrency:
  group: codex-software-worker
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  plan:
    if: ${{ vars.REGEAR_CODEX_WORKERS_ENABLED == 'true' && github.repository == 'ronnierosal/Re-Gear' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      action: ${{ steps.plan.outputs.action }}
      plan_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.REGEAR_CODEX_GITHUB_TOKEN }}
          REGEAR_CODEX_WORKERS_ENABLED: ${{ vars.REGEAR_CODEX_WORKERS_ENABLED }}
          WORKER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/codex_worker.py plan
      - id: artifact
        if: ${{ steps.plan.outputs.action != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: trusted-worker-plan
          path: plan.json
          retention-days: 7

  work:
    needs: plan
    if: ${{ needs.plan.outputs.action != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      bundle_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: task
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: control
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Dependency setup executes only the trusted default-branch lockfile.
      - name: Install baseline dependencies
        working-directory: task
        run: pnpm install --frozen-lockfile
      - name: Freeze task baseline and prompt
        run: python control/scripts/codex_worker.py prepare --root task --control control --plan control/plan.json
      - name: Execute bounded Codex worker
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/task
          prompt-file: ${{ github.workspace }}/control/prompt.txt
          output-schema-file: ${{ github.workspace }}/control/schema.json
          output-file: ${{ github.workspace }}/task/.codex-worker-report.json
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: true
          codex-args: '["--ephemeral"]'
      - name: Export proposal using trusted adapter
        run: python control/scripts/codex_worker.py export --root task --control control --plan control/plan.json --bundle bundle.json
      - id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-proposal
          path: bundle.json
          retention-days: 7

  publish:
    needs: [plan, work]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_id }}
          path: trusted-plan
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.work.outputs.bundle_id }}
          path: proposal
          merge-multiple: true
      - name: Revalidate and publish without executing proposal code
        env:
          GH_TOKEN: ${{ secrets.REGEAR_CODEX_GITHUB_TOKEN }}
        run: python scripts/codex_worker.py publish --plan trusted-plan/plan.json --bundle proposal/bundle.json
