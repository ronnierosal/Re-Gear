name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        type: choice
        options:
          - development
          - production
        default: development
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.profile || 'both' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Preserve the repository's required check name while validating both profiles.
  foundation:
    needs: build_profiles
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every requested profile to pass
        env:
          PROFILE_RESULT: ${{ needs.build_profiles.result }}
        run: test "$PROFILE_RESULT" = success

  build_profiles:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["development","production"]') }}
    runs-on: ubuntu-latest
    env:
      REGEAR_BUILD_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate requested build profile
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
        run: python scripts/build_profiles.py --profile "$BUILD_PROFILE"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Decky UI
        # First, because dist/ is generated rather than committed and three
        # later gates read it from the checkout: tests/test_capture_provenance.py
        # hashes dist/index.js as one of the critical files, and the branding
        # and bundle-clearance frontend tests audit the shipped bundle rather
        # than the sources. A fresh clone has nothing for them to read until
        # this runs, so every one of them must come after it.
        run: pnpm build
      - name: Check documentation links and navigation
        run: python scripts/check_docs_links.py
      - name: Check architecture boundaries
        run: python scripts/check_architecture.py
      - name: Run unit and fixture tests
        run: python -m unittest discover -s tests -v
      - name: Test privileged installer with isolated fixtures
        # Root ownership, procfs and dirfd semantics are security boundaries.
        # Tests patch all installation roots and service operations.
        run: sudo "$(command -v python)" -m unittest discover -s tests -p test_ally_deploy_helper.py -v
      - name: Test whole-dock privileged filesystem boundaries
        # The whole-dock writer uses temporary fake sysfs trees. Root is needed
        # to exercise production ancestor ownership checks in the claim store.
        # No real device paths or service operations are used by these fixtures.
        run: |
          sudo env PYTHONPATH=backend "$(command -v python)" -m unittest discover -s tests -p 'test_whole_dock*.py' -v
          sudo env PYTHONPATH=backend "$(command -v python)" -m unittest discover -s tests -p 'test_dock_power*.py' -v
      - name: Test automatic recovery through production root admission
        # The fixture confines fixed production paths to a child chroot. The
        # plugin gate factory, root-state validation and locks remain real.
        # Unlike ordinary cross-platform discovery, skipped coverage fails here.
        run: |
          sudo env PYTHONPATH=backend "$(command -v python)" - <<'PY'
          import os
          import sys
          import unittest
          if sys.platform != "linux" or os.geteuid() != 0:
              raise SystemExit("automatic recovery admission requires Linux root")
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_automatic_recovery_privileged")
          if suite.countTestCases() == 0:
              raise SystemExit("automatic recovery admission suite is empty")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.testsRun > 0 and result.wasSuccessful() and not result.skipped and not result.expectedFailures else 1)
          PY
      - name: Compile Python sources
        run: python -m compileall -q backend tests scripts
      - name: Check for undefined and redefined names
        # compileall proves the sources parse, not that every name resolves.
        # 0.3.57 shipped a NameError on a code path no test executed, because a
        # deleted function's call site survived a failed edit. These four rules
        # catch that statically and are deliberately narrow: a broader lint gate
        # would fail on 50 pre-existing unused imports and star imports that are
        # not correctness defects, and would have to be cleaned before it could
        # be enforced at all.
        run: |
          python -m pip install --quiet ruff
          python -m ruff check --select F821,F811,F822,F823 --no-cache backend main.py scripts tests
      - name: Check whitespace
        run: git diff --check
      - name: Smoke read-only diagnostics CLI
        env:
          PYTHONPATH: backend
        run: python -m regear.cli --compact
      - name: Type-check Decky UI
        run: pnpm typecheck
      - name: Test Steam sleep preflight
        run: pnpm test:frontend
      - name: Check live preflight probe
        run: node --check scripts/probe_steam_suspend_store.mjs
      - name: Verify dist/ stays out of version control
        # This replaced a byte-for-byte comparison of committed frontend
        # outputs. That gate was correct but the artifact should not have been
        # in Git at all: dist/index.js.map became the most contended path in the
        # repository, conflicting in pull requests whose source merged cleanly.
        # The build above is now the only source of truth, and the packaging
        # steps below consume it. This step only stops dist/ creeping back in.
        run: |
          tracked="$(git ls-files -- dist/)"
          if [ -n "$tracked" ]; then
            echo "dist/ is generated by 'pnpm build' and must not be tracked."
            echo "Tracked paths found:"
            echo "$tracked"
            exit 1
          fi
      - name: Check Decky package contract
        run: python scripts/check_plugin_package.py .
      - name: Build Decky archive
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
        run: python scripts/build_plugin.py --profile "$BUILD_PROFILE"
      - name: Record validation artifact provenance
        run: |
          git rev-parse HEAD > out/source-revision.txt
          sha256sum out/Re-Gear-*.zip > out/SHA256SUMS.txt
      - name: Verify controlled validation artifact
        run: python scripts/verify_validation_artifact.py "$GITHUB_WORKSPACE/out"
      - name: Prepare local-only release candidate record
        run: |
          python scripts/prepare_release_candidate.py out/Re-Gear-*.zip \
            --output out/release-candidate.json \
            --notes-template out/RELEASE_NOTES_TEMPLATE.md
      - name: Upload controlled validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Re-Gear-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/Re-Gear-*.zip
            out/source-revision.txt
            out/SHA256SUMS.txt
            out/release-candidate.json
            out/RELEASE_NOTES_TEMPLATE.md
          if-no-files-found: error
          retention-days: 14
