name: Privileged user delivery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privileged-user-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Linux delivery as root and a distinct destination user
        run: sudo "$(command -v python)" -m unittest discover -s tests -p test_user_directory.py -v
