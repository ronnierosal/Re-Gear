name: Coordination gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write
concurrency:
  group: github-task-record-writer
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute pull-request code with this token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Refresh all open PR coordination statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_coordination.py gate-event
