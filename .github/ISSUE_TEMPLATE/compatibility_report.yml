name: Compatibility report
description: Share bounded hardware evidence without implying certification.
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: input
    id: build
    attributes:
      label: Re-Gear version and build
      placeholder: "0.2.0 / abc123def456"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Host, eGPU, display, and SteamOS
      description: Use product names and public OS version only; omit serials, addresses, and unique IDs.
    validations:
      required: true
  - type: checkboxes
    id: workflow
    attributes:
      label: Workflows intentionally observed
      options:
        - label: Read-only detection
        - label: Portable placement
        - label: TV Docked placement
        - label: Gameplay
        - label: Return to Portable
        - label: Sleep or recovery
  - type: textarea
    id: result
    attributes:
      label: Result, failures, and recovery
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence reference
      description: A report remains community evidence until maintainers review and promote individual capability claims.
